name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ligatracker
          POSTGRES_PASSWORD: ligatracker
          POSTGRES_DB: ligatracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ligatracker"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ligatracker:ligatracker@localhost:5432/ligatracker_test
      TEST_DATABASE_URL: postgresql://ligatracker:ligatracker@localhost:5432/ligatracker_test
      AUTH_SECRET: ci-secret-solo-para-pruebas-de-32-caracteres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
